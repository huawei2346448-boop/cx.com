<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>魔镜</title>
<style>
  :root{
    --bg:#0a0c10;
    --panel:#12151b;
    --edge:#2a2f3a;
    --text:#e8eaef;
    --muted:#8891a0;
    --glow:#8fb8ff;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:
      radial-gradient(1200px 800px at 50% -10%, #1a2030 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:"Noto Serif SC","Songti SC",Georgia,serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding:32px 20px;
  }
  .stage{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }
  h1{
    font-size:1.5rem;
    font-weight:600;
    text-align:center;
    letter-spacing:.04em;
    line-height:1.6;
    margin:0;
    color:var(--text);
  }
  .sub{
    margin:-18px 0 0;
    color:var(--muted);
    font-size:.85rem;
    text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    letter-spacing:.02em;
  }
  .mirror{
    position:relative;
    width:min(78vw,300px);
    aspect-ratio:3/4;
    border-radius:50% / 42%;
    background:
      radial-gradient(circle at 35% 25%, #232a38, #0d1015 70%);
    border:1px solid var(--edge);
    box-shadow:
      0 0 0 10px #14171e,
      0 0 0 12px #2a2f3a,
      0 30px 60px -20px rgba(0,0,0,.7),
      inset 0 0 40px rgba(0,0,0,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .mirror::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg, rgba(255,255,255,.06), transparent 40%);
    pointer-events:none;
    z-index:3;
  }
  .mirror-inner{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .placeholder{
    color:#4a5568;
    font-size:.8rem;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    letter-spacing:.15em;
    text-align:center;
    padding:0 20px;
  }
  .placeholder .eye{
    display:block;
    font-size:2rem;
    margin-bottom:10px;
    opacity:.5;
  }
  .reveal-img{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transform:scale(1.06);
    filter:brightness(.4) saturate(.6);
    transition:opacity 1.1s ease, transform 1.6s ease, filter 1.6s ease;
  }
  .mirror.active .reveal-img{
    opacity:1;
    transform:scale(1);
    filter:brightness(1) saturate(1);
  }
  .mirror.active .placeholder{display:none;}
  .flash{
    position:absolute;
    inset:0;
    background:var(--glow);
    opacity:0;
    z-index:4;
    pointer-events:none;
  }
  .mirror.active .flash{
    animation:flashpulse 1s ease-out;
  }
  @keyframes flashpulse{
    0%{opacity:0;}
    15%{opacity:.85;}
    100%{opacity:0;}
  }
  .caption{
    min-height:1.4em;
    font-size:.9rem;
    color:var(--muted);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    letter-spacing:.03em;
    text-align:center;
    transition:color .6s ease;
  }
  .caption.on{color:var(--glow);}
  button{
    appearance:none;
    border:1px solid #3a4152;
    background:linear-gradient(180deg,#1c2029,#14171e);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.95rem;
    letter-spacing:.05em;
    padding:14px 34px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .3s ease, transform .15s ease, box-shadow .3s ease;
  }
  button:hover{border-color:var(--glow);box-shadow:0 0 24px -6px rgba(143,184,255,.5);}
  button:active{transform:scale(.97);}
  button:focus-visible{outline:2px solid var(--glow);outline-offset:3px;}
  button:disabled{opacity:.5;cursor:default;box-shadow:none;}
  @media (prefers-reduced-motion:reduce){
    .reveal-img,.mirror.active .flash{transition:none;animation:none;}
  }
</style>
</head>

</div>
<script>
  const btn = document.getElementById("btn");
  const mirror = document.getElementById("mirror");
  const caption = document.getElementById("caption");
  const lines = ["正在对焦...", "正在读取镜中之影...", "真实样貌已显现"];
  btn.addEventListener("click", () => {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = "识别中...";
    caption.textContent = lines[0];
    setTimeout(() => { caption.textContent = lines[1]; }, 550);
    setTimeout(() => {
      mirror.classList.add("active");
      caption.textContent = lines[2];
      caption.classList.add("on");
      btn.textContent = "重新照一次";
      btn.disabled = false;
    }, 1300);
  });
</script>
