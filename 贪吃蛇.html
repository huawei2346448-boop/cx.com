<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0f172a; font-family: system-ui, sans-serif; color: #e2e8f0; user-select: none; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }

  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(15,23,42,0.75); }
  #overlay h1 { font-size: 32px; margin-bottom: 12px; }
  #overlay p { margin-bottom: 20px; opacity: 0.85; }
  button { padding: 12px 32px; font-size: 18px; border: none; border-radius: 999px; background: #38bdf8; color: #0f172a; font-weight: 700; cursor: pointer; }
  .hidden { display: none !important; }
</style>

const SEG = 10;          // 节段间距（像素）
const SPEED = 140;       // 玩家蛇移动速度
const AI_SPEED = 110;    // 其它蛇移动速度
const TURN = 5;          // 转向速度（弧度/秒）
const START_SEGS = 14;
const GROW_SEG = 10;     // 每个食物增加的节段数（约100像素）
const FOOD_R = 8;
const FOOD_COUNT = 3;
const AI_COUNT = 3;
const AI_COLORS = ['#f472b6', '#a78bfa', '#fb923c'];

let snakes, foods, player, score, running;
let keys = {};
let joyActive = false, joyAngle = 0, joyPower = 0;
let lastT = 0;

function resize() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function randomFood() {
  const w = window.innerWidth, h = window.innerHeight;
  return { x: 40 + Math.random() * (w - 80), y: 60 + Math.random() * (h - 120), hue: Math.random() * 360 };
}

function makeSnake(x, y, heading, isPlayer, color) {
  const segs = [];
  for (let k = 0; k < START_SEGS; k++) segs.push({ x: x - Math.cos(heading) * k * SEG, y: y - Math.sin(heading) * k * SEG });
  return { segs, heading, pending: 0, isPlayer, color, dead: false, respawnT: 0, aiT: 0, aiTarget: heading, invincibleT: 3 };
}

function randomSpawn() {
  const w = window.innerWidth, h = window.innerHeight;
  return { x: 100 + Math.random() * (w - 200), y: 100 + Math.random() * (h - 200), heading: Math.random() * Math.PI * 2 };
}

function reset() {
  const w = window.innerWidth, h = window.innerHeight;
  player = makeSnake(w / 2, h / 2, 0, true, null);
  snakes = [player];
  for (let i = 0; i < AI_COUNT; i++) {
    const sp = randomSpawn();
    snakes.push(makeSnake(sp.x, sp.y, sp.heading, false, AI_COLORS[i % AI_COLORS.length]));
  }
  foods = Array.from({ length: FOOD_COUNT }, randomFood);
  score = 0;
  updateHUD();
}

function updateHUD() {
  document.getElementById('len').textContent = Math.round(player.segs.length * SEG);
  document.getElementById('score').textContent = score;
}

// ---------- 轮盘 ----------
function joyCenter() {
  const r = joy.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, R: r.width / 2 };
}
function joyMove(clientX, clientY) {
  const c = joyCenter();
  const dx = clientX - c.x, dy = clientY - c.y;
  const dist = Math.hypot(dx, dy);
  joyAngle = Math.atan2(dy, dx);
  joyPower = Math.min(dist / c.R, 1);
  const kd = Math.min(dist, c.R * 0.75);
  knob.style.left = (c.R + Math.cos(joyAngle) * kd) + 'px';
  knob.style.top = (c.R + Math.sin(joyAngle) * kd) + 'px';
}
function joyReset() {
  joyActive = false;
  knob.style.left = '50%';
  knob.style.top = '50%';
}
joy.addEventListener('pointerdown', e => {
  joyActive = true;
  joy.setPointerCapture(e.pointerId);
  joyMove(e.clientX, e.clientY);
  if (!running) startGame();
});
joy.addEventListener('pointermove', e => { if (joyActive) joyMove(e.clientX, e.clientY); });
joy.addEventListener('pointerup', joyReset);
joy.addEventListener('pointercancel', joyReset);

// ---------- 键盘 ----------
const keyAngles = { ArrowUp: -Math.PI/2, ArrowDown: Math.PI/2, ArrowLeft: Math.PI, ArrowRight: 0,
                    w: -Math.PI/2, s: Math.PI/2, a: Math.PI, d: 0 };
window.addEventListener('keydown', e => {
  if (keyAngles[e.key] !== undefined) {
    keys[e.key] = true;
    e.preventDefault();
    if (!running) startGame();
  }
});
window.addEventListener('keyup', e => { delete keys[e.key]; });

function keyControl() {
  let x = 0, y = 0, any = false;
  for (const k in keys) { any = true; x += Math.cos(keyAngles[k]); y += Math.sin(keyAngles[k]); }
  if (any && (x || y)) return Math.atan2(y, x);
  return null;
}

// ---------- 通用蛇逻辑 ----------
function turnToward(s, target, dt) {
  let diff = target - s.heading;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  const maxStep = TURN * dt;
  s.heading += Math.max(-maxStep, Math.min(maxStep, diff));
}

// 蛇头前进后，身体每节跟随前一节，形成自然弯曲
function moveSnake(s, speed, dt) {
  const head = s.segs[0];
  head.x += Math.cos(s.heading) * speed * dt;
  head.y += Math.sin(s.heading) * speed * dt;
  for (let i = 1; i < s.segs.length; i++) {
    const cur = s.segs[i], prev = s.segs[i - 1];
    const dx = cur.x - prev.x, dy = cur.y - prev.y;
    const d = Math.hypot(dx, dy);
    if (d > SEG) {
      cur.x = prev.x + dx * SEG / d;
      cur.y = prev.y + dy * SEG / d;
    }
  }
  if (s.pending > 0) {
    const tail = s.segs[s.segs.length - 1];
    s.segs.push({ x: tail.x, y: tail.y });
    s.pending--;
  }
}

function killSnake(s) {
  s.dead = true;
  s.respawnT = 2;
  // 死亡后身体变成食物
  for (let i = 0; i < s.segs.length; i += 2) {
    foods.push({ x: s.segs[i].x, y: s.segs[i].y, hue: s.isPlayer ? 120 : Math.random() * 360 });
  }
}

function respawn(s) {
  const sp = randomSpawn();
  const fresh = makeSnake(sp.x, sp.y, sp.heading, false, s.color);
  s.segs = fresh.segs;
  s.heading = fresh.heading;
  s.pending = 0;
  s.aiTarget = s.heading;
  s.dead = false;
  s.invincibleT = 3;
}

function updateAI(s, dt) {
  const head = s.segs[0];
  const w = window.innerWidth, h = window.innerHeight;
  s.aiT -= dt;
  const nearEdge = head.x < 80 || head.x > w - 80 || head.y < 80 || head.y > h - 80;
  if (nearEdge) {
    s.aiTarget = Math.atan2(h / 2 - head.y, w / 2 - head.x);
  } else if (s.aiT <= 0) {
    s.aiT = 0.4 + Math.random() * 0.6;
    // 找最近的食物追踪，带随机偏移
    let best = null, bestD = Infinity;
    for (const f of foods) {
      const d = Math.hypot(f.x - head.x, f.y - head.y);
      if (d < bestD) { bestD = d; best = f; }
    }
    if (best && Math.random() < 0.7) {
      s.aiTarget = Math.atan2(best.y - head.y, best.x - head.x) + (Math.random() - 0.5) * 0.4;
    } else {
      s.aiTarget = s.heading + (Math.random() - 0.5) * 1.5;
    }
  }
  turnToward(s, s.aiTarget, dt);
  moveSnake(s, AI_SPEED, dt);
}

// 吃食物
function checkFood(s) {
  const head = s.segs[0];
  for (let i = 0; i < foods.length; i++) {
    const f = foods[i];
    if (Math.hypot(head.x - f.x, head.y - f.y) < FOOD_R + SEG * 0.6) {
      s.pending += GROW_SEG;
      if (s.isPlayer) { score += 1; updateHUD(); }
      foods[i] = randomFood();
    }
  }
}

// 碰撞：头部碰到任意蛇的身体（跳过自己头部附近）
function collides(s) {
  const head = s.segs[0];
  for (const other of snakes) {
    if (other.dead) continue;
    const start = other === s ? 6 : 0;
    for (let i = start; i < other.segs.length; i++) {
      const p = other.segs[i];
      if (Math.hypot(head.x - p.x, head.y - p.y) < SEG * 0.8) return true;
    }
  }
  return false;
}

function gameOver() {
  running = false;
  document.getElementById('title').textContent = '游戏结束';
  document.getElementById('msg').textContent = `最终得分：${score}　长度：${Math.round(player.segs.length * SEG)}`;
  document.getElementById('start').textContent = '再来一局';
  overlay.classList.remove('hidden');
}

function startGame() {
  reset();
  running = true;
  overlay.classList.add('hidden');
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function update(dt) {
  const w = window.innerWidth, h = window.innerHeight;

  // 玩家方向
  let target = null;
  if (joyActive && joyPower > 0.15) target = joyAngle;
  else {
    const kc = keyControl();
    if (kc !== null) target = kc;
  }
  if (target !== null) turnToward(player, target, dt);
  moveSnake(player, SPEED, dt);

  for (const s of snakes) if (s.invincibleT > 0) s.invincibleT -= dt;

  const ph = player.segs[0];
  if (player.invincibleT <= 0 && (ph.x < 0 || ph.x > w || ph.y < 0 || ph.y > h)) return gameOver();

  for (const s of snakes) {
    if (s.dead) {
      s.respawnT -= dt;
      if (s.respawnT <= 0 && !s.isPlayer) respawn(s);
      continue;
    }
    if (!s.isPlayer) updateAI(s, dt);
    checkFood(s);
  }

  // 碰撞检测
  for (const s of snakes) {
    if (s.dead || s.invincibleT > 0) continue;
    const head = s.segs[0];
    if (!s.isPlayer && (head.x < -20 || head.x > w + 20 || head.y < -20 || head.y > h + 20)) {
      killSnake(s);
      continue;
    }
    if (collides(s)) {
      if (s.isPlayer) return gameOver();
      killSnake(s);
    }
  }
}

// ---------- 绘制 ----------
function drawSnakeBody(s) {
  const segs = s.segs;
  const blink = s.invincibleT > 0 && Math.floor(performance.now() / 120) % 2 === 0;
  ctx.globalAlpha = blink ? 0.35 : 1;
  for (let i = segs.length - 1; i >= 1; i--) {
    const p = segs[i];
    const ratio = i / segs.length;
    ctx.beginPath();
    ctx.arc(p.x, p.y, SEG * 0.6, 0, Math.PI * 2);
    if (s.isPlayer) {
      ctx.fillStyle = `hsl(${150 + ratio * 40}, 70%, ${45 + ratio * 15}%)`;
    } else {
      ctx.fillStyle = s.color;
      ctx.globalAlpha = 0.6 + 0.4 * (1 - ratio);
    }
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = 1;
  const head = segs[0];
  const hx = head.x, hy = head.y;
  if (s.isPlayer) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(hx, hy, SEG * 1.6, 0, Math.PI * 2);
    ctx.clip();
    if (headImg.complete && headImg.naturalWidth) {
      ctx.drawImage(headImg, hx - SEG * 1.6, hy - SEG * 1.6, SEG * 3.2, SEG * 3.2);
    }
    ctx.restore();
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(hx, hy, SEG * 1.6, 0, Math.PI * 2); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(hx, hy, SEG * 0.8, 0, Math.PI * 2);
    ctx.fillStyle = s.color;
    ctx.fill();
    ctx.fillStyle = '#000';
    for (const off of [-0.5, 0.5]) {
      ctx.beginPath();
      ctx.arc(hx + Math.cos(s.heading + off) * SEG * 0.4, hy + Math.sin(s.heading + off) * SEG * 0.4, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function draw() {
  const w = window.innerWidth, h = window.innerHeight;
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

  for (const food of foods) {
    const g = ctx.createRadialGradient(food.x, food.y, 0, food.x, food.y, FOOD_R * 2);
    g.addColorStop(0, `hsl(${food.hue}, 100%, 70%)`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(food.x, food.y, FOOD_R * 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `hsl(${food.hue}, 100%, 65%)`;
    ctx.beginPath(); ctx.arc(food.x, food.y, FOOD_R, 0, Math.PI * 2); ctx.fill();
  }

  for (const s of snakes) if (!s.dead) drawSnakeBody(s);
  // 玩家蛇最后绘制，保证在最上层
  if (!player.dead) drawSnakeBody(player);
}

function loop(t) {
  if (!running) return;
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;
  update(dt);
  if (running) {
    updateHUD();
    draw();
    requestAnimationFrame(loop);
  }
}

document.getElementById('start').addEventListener('click', startGame);
reset();
draw();
</script>
</body>
